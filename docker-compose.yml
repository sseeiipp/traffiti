services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: crew
      POSTGRES_PASSWORD: crew
      POSTGRES_DB: crew
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crew"]
      interval: 3s
      retries: 20

volumes:
  dbdata:
